<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useful HTML Coding Resources</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #f4f4f4;
            margin: 40px;
            color: #222;
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background-color: #ffffff;
        }
        th {
            background-color: #1a1a2e;
            color: #ffffff;
            padding: 12px 16px;
            text-align: left;
        }
        td {
            padding: 12px 16px;
            border: 1px solid #cccccc;
        }
        tr:nth-child(even) {
            background-color: #e8eaf6;
        }
        a {
            color: #1a1a2e;
        }
    </style>
</head>
<body>
 
    <h1>Splendid's HTML Coding Resources</h1>
 
    <table>
        <tr>
            <th><strong>Topic</strong></th>
            <th><strong>Name of the website</strong></th>
            <th><strong>URL</strong></th>
        </tr>
        <tr>
            <td>HTML Basics &amp; Reference</td>
            <td>MDN Web Docs</td>
            <td><a href="https://developer.mozilla.org/en-US/docs/Web/HTML">https://developer.mozilla.org/en-US/docs/Web/HTML</a></td>
        </tr>
        <tr>
            <td>HTML Tutorials for Beginners</td>
            <td>W3Schools</td>
            <td><a href="https://www.w3schools.com/html/">https://www.w3schools.com/html/</a></td>
        </tr>
        <tr>
            <td>HTML Validation &amp; Best Practices</td>
            <td>W3C HTML Validator</td>
            <td><a href="https://validator.w3.org/">https://validator.w3.org/</a></td>
        </tr>
    </table>
 
</body>
</html>
